<script>
/* ============================================================
   OMNI-VERSE — Single-file procedural universe engine
   10,000,000 independent worlds
   ============================================================ */

const GENRES = [
  { id: 0, name: "Quantum Highway", key: "highway" },
  { id: 1, name: "Stellar Gravity", key: "orbital" },
  { id: 2, name: "Zero-G Wave", key: "wave" },
  { id: 3, name: "Core Guardian", key: "shooter" },
  { id: 4, name: "Chrono Sync", key: "chrono" }
];

const SCALES = [
  [0,2,4,5,7,9,11],          // Major
  [0,2,3,5,7,8,10],          // Natural Minor
  [0,2,3,5,7,9,10],          // Dorian
  [0,1,4,5,7,8,11],          // Phrygian Dominant-ish
  [0,2,4,6,7,9,11],          // Lydian
  [0,2,4,5,7,9,10],          // Mixolydian
  [0,1,3,5,6,8,10],          // Locrian-ish
  [0,3,5,6,7,10]             // Blues-ish
];

// ---------- Seeded PRNG ----------
function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function hashString(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// ---------- Color helpers ----------
function hsl(h, s, l, a = 1) {
  return `hsla(${h % 360}, ${s}%, ${l}%, ${a})`;
}

function generatePalette(rng) {
  const baseHue = Math.floor(rng() * 360);
  const sat = 55 + rng() * 30;
  return {
    primary: hsl(baseHue, sat, 58),
    secondary: hsl(baseHue + 40 + rng()*30, sat - 10, 50),
    accent: hsl(baseHue + 180 + rng()*40, 70, 60),
    bg: hsl(baseHue, 25, 6),
    glow: hsl(baseHue, 80, 65, 0.4),
    particle: hsl(baseHue + 20, 70, 70),
    trail: hsl(baseHue, 60, 55, 0.35)
  };
}

// ---------- World generation ----------
function createWorld(id) {
  id = Math.max(0, Math.min(9999999, Math.floor(Number(id) || 0)));
  const seed = hashString("OMNI-" + id);
  const rng = mulberry32(seed);
  
  const genreIdx = Math.floor(rng() * 5);
  const genre = GENRES[genreIdx];
  const palette = generatePalette(rng);
  const scale = SCALES[Math.floor(rng() * SCALES.length)];
  const rootNote = 48 + Math.floor(rng() * 12); // C3–B3 range
  
  // Physics parameters
  const gravity = 0.15 + rng() * 0.55;
  const speed = 2.2 + rng() * 4.5;
  const friction = 0.92 + rng() * 0.06;
  const bounce = 0.3 + rng() * 0.5;
  
  // Art style variance
  const artStyle = {
    particleDensity: 0.4 + rng() * 0.9,
    trailLength: 4 + Math.floor(rng() * 12),
    shapeComplexity: Math.floor(rng() * 4),
    glowIntensity: 0.3 + rng() * 0.7
  };

  return {
    id,
    seed,
    genre,
    palette,
    scale,
    rootNote,
    gravity,
    speed,
    friction,
    bounce,
    artStyle,
    name: `Universe ${String(id).padStart(7, '0')}`
  };
}

// ---------- Audio Engine ----------
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.muted = false;
    this.playing = false;
    this.interval = null;
    this.world = null;
  }
  
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.18;
    this.master.connect(this.ctx.destination);
  }
  
  setWorld(world) {
    this.world = world;
  }
  
  playNote(freq, dur = 0.25, type = 'sine', gain = 0.3) {
    if (!this.ctx || this.muted) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1800 + Math.random() * 800;
    
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0, this.ctx.currentTime);
    g.gain.linearRampToValueAtTime(gain, this.ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    
    osc.connect(filter);
    filter.connect(g);
    g.connect(this.master);
    osc.start();
    osc.stop(this.ctx.currentTime + dur + 0.05);
  }
  
  startBGM() {
    this.stopBGM();
    if (!this.world || this.muted) return;
    this.playing = true;
    this.init();
    
    const { scale, rootNote } = this.world;
    let step = 0;
    const tempo = 140 + (this.world.seed % 80);
    const intervalMs = (60 / tempo) * 1000 * 0.5;
    
    this.interval = setInterval(() => {
      if (!this.playing || this.muted) return;
      const deg = scale[step % scale.length];
      const octave = Math.floor(step / scale.length) % 2;
      const freq = 440 * Math.pow(2, (rootNote + deg + octave * 12 - 69) / 12);
      const type = ['sine', 'triangle', 'sine', 'square'][step % 4];
      this.playNote(freq, 0.28, type, 0.22);
      
      // occasional bass
      if (step % 4 === 0) {
        const bassFreq = 440 * Math.pow(2, (rootNote + scale[0] - 24 - 69) / 12);
        this.playNote(bassFreq, 0.4, 'triangle', 0.15);
      }
      step++;
    }, intervalMs);
  }
  
  stopBGM() {
    this.playing = false;
    if (this.interval) {
      clearInterval(this.interval);
      this.interval = null;
    }
  }
  
  toggleMute() {
    this.muted = !this.muted;
    if (this.muted) this.stopBGM();
    else if (this.world) this.startBGM();
    return this.muted;
  }
  
  sfx(type) {
    if (!this.ctx || this.muted) return;
    this.init();
    if (type === 'jump') this.playNote(520 + Math.random()*80, 0.12, 'square', 0.15);
    if (type === 'hit') this.playNote(180, 0.2, 'sawtooth', 0.2);
    if (type === 'score') this.playNote(880, 0.15, 'sine', 0.18);
    if (type === 'die') {
      this.playNote(220, 0.4, 'sawtooth', 0.25);
      setTimeout(() => this.playNote(110, 0.5, 'triangle', 0.2), 100);
    }
  }
}

// ---------- Game Engine ----------
class OmniGame {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.world = null;
    this.audio = new AudioEngine();
    this.state = 'idle'; // idle | playing | dead
    this.score = 0;
    this.keys = {};
    this.touch = { left: false, right: false, action: false };
    this.entities = [];
    this.particles = [];
    this.player = null;
    this.time = 0;
    this.lastTime = 0;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    
    this.resize();
    window.addEventListener('resize', () => this.resize());
    this.bindInput();
  }
  
  resize() {
    const rect = this.canvas.parentElement.getBoundingClientRect();
    this.w = rect.width;
    this.h = rect.height;
    this.canvas.width = this.w * this.dpr;
    this.canvas.height = this.h * this.dpr;
    this.canvas.style.width = this.w + 'px';
    this.canvas.style.height = this.h + 'px';
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  }
  
  bindInput() {
    window.addEventListener('keydown', e => {
      this.keys[e.code] = true;
      if (['Space', 'ArrowUp', 'ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD'].includes(e.code)) e.preventDefault();
    });
    window.addEventListener('keyup', e => { this.keys[e.code] = false; });
    
    this.canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.touches[0];
      const x = t.clientX / this.w;
      if (x < 0.3) this.touch.left = true;
      else if (x > 0.7) this.touch.right = true;
      else this.touch.action = true;
    }, { passive: false });
    
    this.canvas.addEventListener('touchend', () => {
      this.touch = { left: false, right: false, action: false };
    });
  }
  
  loadWorld(id) {
    this.world = createWorld(id);
    this.audio.setWorld(this.world);
    this.applyTheme();
    this.resetGame();
    this.updateHUD();
  }
  
  applyTheme() {
    const p = this.world.palette;
    document.documentElement.style.setProperty('--accent', p.primary);
    document.documentElement.style.setProperty('--accent2', p.accent);
    document.documentElement.style.setProperty('--bg', p.bg);
  }
  
  resetGame() {
    this.state = 'idle';
    this.score = 0;
    this.time = 0;
    this.entities = [];
    this.particles = [];
    this.player = this.createPlayer();
    this.spawnInitial();
  }
  
  createPlayer() {
    const g = this.world.genre.key;
    if (g === 'highway') {
      return { x: this.w * 0.2, y: this.h * 0.5, vx: 0, vy: 0, r: 14, onGround: false, angle: 0 };
    }
    if (g === 'orbital') {
      return { x: this.w * 0.5, y: this.h * 0.5, vx: 0, vy: 0, r: 12, angle: 0, orbitR: 80 };
    }
    if (g === 'wave') {
      return { x: this.w * 0.25, y: this.h * 0.5, vx: 0, vy: 0, r: 13, wavePhase: 0 };
    }
    if (g === 'shooter') {
      return { x: this.w * 0.5, y: this.h * 0.5, vx: 0, vy: 0, r: 16, angle: 0, cooldown: 0 };
    }
    // chrono
    return { x: this.w * 0.5, y: this.h * 0.7, vx: 0, vy: 0, r: 14, combo: 0, nextBeat: 1 };
  }
  
  spawnInitial() {
    const g = this.world.genre.key;
    if (g === 'highway') {
      for (let i = 0; i < 8; i++) this.spawnObstacle(this.w + i * 180);
    }
    if (g === 'orbital') {
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        this.entities.push({
          type: 'planet',
          x: this.w/2 + Math.cos(a)*160,
          y: this.h/2 + Math.sin(a)*160,
          r: 18 + Math.random()*14,
          angle: a,
          dist: 140 + Math.random()*80
        });
      }
    }
    if (g === 'wave') {
      for (let i = 0; i < 12; i++) {
        this.entities.push({ type: 'ring', x: this.w + i * 140, y: this.h*0.5, r: 30 + Math.random()*40, passed: false });
      }
    }
    if (g === 'shooter') {
      for (let i = 0; i < 5; i++) this.spawnEnemy();
    }
    if (g === 'chrono') {
      for (let i = 0; i < 4; i++) {
        this.entities.push({
          type: 'beat',
          x: 80 + i * (this.w - 160)/3,
          y: this.h * 0.4,
          r: 22,
          active: false,
          timer: 0
        });
      }
    }
  }
  
  spawnObstacle(x) {
    const h = 40 + Math.random() * 120;
    const top = Math.random() > 0.5;
    this.entities.push({
      type: 'obstacle',
      x, y: top ? 0 : this.h - h,
      w: 28 + Math.random()*20,
      h,
      scored: false
    });
  }
  
  spawnEnemy() {
    const side = Math.floor(Math.random()*4);
    let x, y;
    if (side === 0) { x = -20; y = Math.random()*this.h; }
    else if (side === 1) { x = this.w + 20; y = Math.random()*this.h; }
    else if (side === 2) { x = Math.random()*this.w; y = -20; }
    else { x = Math.random()*this.w; y = this.h + 20; }
    this.entities.push({
      type: 'enemy',
      x, y,
      vx: (this.w/2 - x) * 0.002 * this.world.speed,
      vy: (this.h/2 - y) * 0.002 * this.world.speed,
      r: 10 + Math.random()*10,
      hp: 1
    });
  }
  
  start() {
    if (this.state === 'playing') return;
    this.resetGame();
    this.state = 'playing';
    this.audio.init();
    this.audio.startBGM();
    this.lastTime = performance.now();
    requestAnimationFrame(t => this.loop(t));
  }
  
  loop(now) {
    if (this.state !== 'playing') return;
    const dt = Math.min((now - this.lastTime) / 16.666, 2.5);
    this.lastTime = now;
    this.time += dt;
    
    this.update(dt);
    this.draw();
    
    requestAnimationFrame(t => this.loop(t));
  }
  
  update(dt) {
    const g = this.world.genre.key;
    const p = this.player;
    
    // Input
    const left = this.keys['ArrowLeft'] || this.keys['KeyA'] || this.touch.left;
    const right = this.keys['ArrowRight'] || this.keys['KeyD'] || this.touch.right;
    const action = this.keys['Space'] || this.keys['ArrowUp'] || this.touch.action;
    
    if (g === 'highway') {
      // Gravity runner side-view
      p.vy += this.world.gravity * dt * 1.8;
      if (left) p.vx -= 0.4 * dt;
      if (right) p.vx += 0.4 * dt;
      p.vx *= this.world.friction;
      p.x += p.vx * this.world.speed * 0.3;
      p.y += p.vy;
      
      // floor / ceiling
      if (p.y > this.h - p.r) { p.y = this.h - p.r; p.vy = 0; p.onGround = true; }
      else if (p.y < p.r) { p.y = p.r; p.vy = 0; }
      else p.onGround = false;
      
      if (action && p.onGround) {
        p.vy = -9.5 * (0.7 + this.world.bounce);
        this.audio.sfx('jump');
        this.spawnParticles(p.x, p.y, 6);
      }
      
      // obstacles scroll
      for (const e of this.entities) {
        if (e.type === 'obstacle') {
          e.x -= this.world.speed * 1.4 * dt;
          if (!e.scored && e.x + e.w < p.x) {
            e.scored = true;
            this.score += 10;
            this.audio.sfx('score');
          }
          // collision
          if (p.x + p.r > e.x && p.x - p.r < e.x + e.w &&
              p.y + p.r > e.y && p.y - p.r < e.y + e.h) {
            this.die();
          }
        }
      }
      this.entities = this.entities.filter(e => e.x > -50);
      if (this.entities.filter(e => e.type === 'obstacle').length < 6) {
        const last = this.entities[this.entities.length-1];
        this.spawnObstacle((last ? last.x : this.w) + 160 + Math.random()*80);
      }
      // keep player in bounds horizontally a bit
      p.x = Math.max(p.r + 20, Math.min(this.w * 0.55, p.x));
    }
    
    else if (g === 'orbital') {
      // Centrifugal / orbital
      const cx = this.w / 2, cy = this.h / 2;
      if (left) p.angle -= 0.045 * dt * this.world.speed;
      if (right) p.angle += 0.045 * dt * this.world.speed;
      if (action) p.orbitR = Math.max(40, p.orbitR - 1.8 * dt);
      else p.orbitR = Math.min(200, p.orbitR + 0.6 * dt);
      
      p.x = cx + Math.cos(p.angle) * p.orbitR;
      p.y = cy + Math.sin(p.angle) * p.orbitR;
      
      for (const e of this.entities) {
        if (e.type === 'planet') {
          e.angle += 0.008 * dt;
          e.x = cx + Math.cos(e.angle) * e.dist;
          e.y = cy + Math.sin(e.angle) * e.dist;
          const dx = p.x - e.x, dy = p.y - e.y;
          if (Math.hypot(dx, dy) < p.r + e.r) this.die();
        }
      }
      if (Math.floor(this.time) % 90 === 0) this.score += 5;
    }
    
    else if (g === 'wave') {
      p.wavePhase += 0.04 * dt * this.world.speed;
      const baseY = this.h * 0.5 + Math.sin(p.wavePhase) * (60 + this.world.gravity * 40);
      if (left) p.x -= 2.5 * dt;
      if (right) p.x += 2.5 * dt;
      if (action) p.y += (baseY - 80 - p.y) * 0.08 * dt;
      else p.y += (baseY - p.y) * 0.06 * dt;
      
      p.x = Math.max(p.r, Math.min(this.w * 0.6, p.x));
      
      for (const e of this.entities) {
        if (e.type === 'ring') {
          e.x -= this.world.speed * 1.2 * dt;
          if (!e.passed && e.x < p.x) {
            e.passed = true;
            const dy = Math.abs(p.y - e.y);
            if (dy < e.r - 8) {
              this.score += 25;
              this.audio.sfx('score');
              this.spawnParticles(e.x, e.y, 8);
            } else if (dy < e.r + p.r) {
              this.die();
            }
          }
        }
      }
      this.entities = this.entities.filter(e => e.x > -60);
      if (this.entities.length < 8) {
        const lastX = this.entities.length ? Math.max(...this.entities.map(e => e.x)) : this.w;
        this.entities.push({
          type: 'ring',
          x: lastX + 130 + Math.random()*40,
          y: this.h * 0.35 + Math.random() * this.h * 0.3,
          r: 28 + Math.random()*35,
          passed: false
        });
      }
    }
    
    else if (g === 'shooter') {
      if (left) p.x -= 3.2 * dt * this.world.speed * 0.4;
      if (right) p.x += 3.2 * dt * this.world.speed * 0.4;
      if (this.keys['ArrowUp'] || this.keys['KeyW']) p.y -= 3.2 * dt;
      if (this.keys['ArrowDown'] || this.keys['KeyS']) p.y += 3.2 * dt;
      p.x = Math.max(p.r, Math.min(this.w - p.r, p.x));
      p.y = Math.max(p.r, Math.min(this.h - p.r, p.y));
      
      p.cooldown = Math.max(0, p.cooldown - dt);
      if (action && p.cooldown <= 0) {
        p.cooldown = 8;
        // shoot toward mouse-ish center or random direction near forward
        const ang = Math.atan2(this.h/2 - p.y, this.w/2 - p.x) + (Math.random()-0.5)*0.3;
        this.entities.push({
          type: 'bullet',
          x: p.x, y: p.y,
          vx: Math.cos(ang) * 9,
          vy: Math.sin(ang) * 9,
          r: 4,
          life: 90
        });
        this.audio.sfx('jump');
      }
      
      for (const e of this.entities) {
        if (e.type === 'enemy') {
          e.x += e.vx * dt * 1.5;
          e.y += e.vy * dt * 1.5;
          // attract slightly
          e.vx += (p.x - e.x) * 0.00015 * dt;
          e.vy += (p.y - e.y) * 0.00015 * dt;
          if (Math.hypot(e.x - p.x, e.y - p.y) < e.r + p.r) this.die();
        }
        if (e.type === 'bullet') {
          e.x += e.vx * dt;
          e.y += e.vy * dt;
          e.life -= dt;
        }
      }
      
      // bullet-enemy collision
      for (const b of this.entities.filter(e => e.type === 'bullet')) {
        for (const en of this.entities.filter(e => e.type === 'enemy')) {
          if (Math.hypot(b.x - en.x, b.y - en.y) < b.r + en.r) {
            en.hp = 0;
            b.life = 0;
            this.score += 50;
            this.audio.sfx('score');
            this.spawnParticles(en.x, en.y, 10);
          }
        }
      }
      
      this.entities = this.entities.filter(e => {
        if (e.type === 'bullet') return e.life > 0;
        if (e.type === 'enemy') return e.hp > 0 && e.x > -40 && e.x < this.w+40 && e.y > -40 && e.y < this.h+40;
        return true;
      });
      
      if (this.entities.filter(e => e.type === 'enemy').length < 4 + Math.floor(this.score/200)) {
        this.spawnEnemy();
      }
    }
    
    else if (g === 'chrono') {
      // Timing combo
      if (left) p.x -= 2.8 * dt;
      if (right) p.x += 2.8 * dt;
      p.x = Math.max(40, Math.min(this.w - 40, p.x));
      
      for (const e of this.entities) {
        if (e.type === 'beat') {
          e.timer += dt * 0.04 * this.world.speed;
          const pulse = Math.sin(e.timer);
          e.active = pulse > 0.85;
          e.scale = 1 + Math.max(0, pulse) * 0.35;
          
          if (e.active && Math.abs(p.x - e.x) < 50 && action) {
            this.score += 30 + p.combo * 10;
            p.combo = Math.min(12, p.combo + 1);
            this.audio.sfx('score');
            this.spawnParticles(e.x, e.y, 12);
            e.timer = 0; // reset
          }
        }
      }
      if (action) {
        // miss penalty soft
        let hit = false;
        for (const e of this.entities) {
          if (e.active && Math.abs(p.x - e.x) < 55) hit = true;
        }
        if (!hit) p.combo = Math.max(0, p.combo - 2);
      }
    }
    
    // Particles
    for (const pt of this.particles) {
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.life -= dt;
      pt.vy += 0.05 * dt;
    }
    this.particles = this.particles.filter(pt => pt.life > 0);
    
    this.updateHUD();
  }
  
  spawnParticles(x, y, n) {
    const col = this.world.palette.particle;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 3;
      this.particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 20 + Math.random() * 25,
        r: 1.5 + Math.random() * 2.5,
        color: col
      });
    }
  }
  
  die() {
    this.state = 'dead';
    this.audio.sfx('die');
    this.audio.stopBGM();
    this.spawnParticles(this.player.x, this.player.y, 25);
    
    setTimeout(() => {
      document.getElementById('overlayTitle').textContent = 'Universe Collapsed';
      document.getElementById('overlayDesc').innerHTML = `Score: <strong>${this.score}</strong><br>World ${String(this.world.id).padStart(7,'0')} · ${this.world.genre.name}`;
      document.getElementById('btnStart').textContent = 'Re-enter Universe';
      document.getElementById('overlay').style.display = 'flex';
    }, 600);
  }
  
  draw() {
    const ctx = this.ctx;
    const w = this.w, h = this.h;
    const pal = this.world.palette;
    const g = this.world.genre.key;
    
    // Background
    ctx.fillStyle = pal.bg;
    ctx.fillRect(0, 0, w, h);
    
    // subtle grid / stars
    ctx.save();
    ctx.globalAlpha = 0.15;
    ctx.strokeStyle = pal.primary;
    ctx.lineWidth = 1;
    const grid = 48;
    const ox = (this.time * 0.3) % grid;
    for (let x = -grid; x < w + grid; x += grid) {
      ctx.beginPath();
      ctx.moveTo(x + ox, 0);
      ctx.lineTo(x + ox, h);
      ctx.stroke();
    }
    for (let y = 0; y < h; y += grid) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    }
    ctx.restore();
    
    // ambient glow orbs
    for (let i = 0; i < 3; i++) {
      const gx = w * (0.2 + i * 0.3) + Math.sin(this.time * 0.01 + i) * 40;
      const gy = h * (0.3 + (i%2)*0.3) + Math.cos(this.time * 0.008 + i) * 30;
      const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, 120);
      grad.addColorStop(0, pal.glow);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fillRect(gx - 120, gy - 120, 240, 240);
    }
    
    // Entities
    for (const e of this.entities) {
      if (e.type === 'obstacle') {
        ctx.fillStyle = pal.secondary;
        ctx.shadowColor = pal.primary;
        ctx.shadowBlur = 12 * this.world.artStyle.glowIntensity;
        ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.shadowBlur = 0;
        // inner highlight
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(e.x, e.y, 3, e.h);
      }
      else if (e.type === 'planet') {
        const grd = ctx.createRadialGradient(e.x - e.r*0.3, e.y - e.r*0.3, 0, e.x, e.y, e.r);
        grd.addColorStop(0, pal.accent);
        grd.addColorStop(1, pal.secondary);
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fillStyle = grd;
        ctx.shadowColor = pal.accent;
        ctx.shadowBlur = 20;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      else if (e.type === 'ring') {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.strokeStyle = pal.primary;
        ctx.lineWidth = 4;
        ctx.shadowColor = pal.primary;
        ctx.shadowBlur = 15;
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r - 8, 0, Math.PI * 2);
        ctx.strokeStyle = pal.accent + '88';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      else if (e.type === 'enemy') {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fillStyle = pal.secondary;
        ctx.shadowColor = '#ff4466';
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      else if (e.type === 'bullet') {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fillStyle = pal.accent;
        ctx.shadowColor = pal.accent;
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      else if (e.type === 'beat') {
        const s = e.scale || 1;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r * s, 0, Math.PI * 2);
        ctx.fillStyle = e.active ? pal.accent : pal.secondary + '66';
        ctx.shadowColor = e.active ? pal.accent : 'transparent';
        ctx.shadowBlur = e.active ? 25 : 0;
        ctx.fill();
        ctx.shadowBlur = 0;
        if (e.active) {
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.r * s + 8, 0, Math.PI * 2);
          ctx.strokeStyle = pal.accent;
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }
    }
    
    // Particles
    for (const pt of this.particles) {
      ctx.globalAlpha = Math.min(1, pt.life / 20);
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
      ctx.fillStyle = pt.color;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    // Player
    if (this.player && this.state !== 'dead') {
      const p = this.player;
      ctx.save();
      ctx.translate(p.x, p.y);
      
      // trail
      if (g === 'highway' || g === 'wave') {
        ctx.globalAlpha = 0.3;
        for (let i = 1; i <= this.world.artStyle.trailLength; i++) {
          ctx.beginPath();
          ctx.arc(-i * 4, 0, p.r * (1 - i * 0.06), 0, Math.PI * 2);
          ctx.fillStyle = pal.trail;
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      
      // body
      const grd = ctx.createRadialGradient(-p.r*0.3, -p.r*0.3, 0, 0, 0, p.r);
      grd.addColorStop(0, '#ffffff');
      grd.addColorStop(0.4, pal.primary);
      grd.addColorStop(1, pal.secondary);
      ctx.beginPath();
      ctx.arc(0, 0, p.r, 0, Math.PI * 2);
      ctx.fillStyle = grd;
      ctx.shadowColor = pal.primary;
      ctx.shadowBlur = 18 * this.world.artStyle.glowIntensity;
      ctx.fill();
      ctx.shadowBlur = 0;
      
      // core
      ctx.beginPath();
      ctx.arc(0, 0, p.r * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      
      ctx.restore();
    }
    
    // vignette
    const vig = ctx.createRadialGradient(w/2, h/2, h*0.3, w/2, h/2, h*0.9);
    vig.addColorStop(0, 'transparent');
    vig.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, w, h);
  }
  
  updateHUD() {
    if (!this.world) return;
    document.getElementById('hudWorldId').textContent = String(this.world.id).padStart(7, '0');
    document.getElementById('hudGenre').textContent = this.world.genre.name;
    document.getElementById('hudScore').textContent = this.score.toLocaleString();
    document.getElementById('hudMeta').textContent =
      `G ${this.world.gravity.toFixed(2)} · SPD ${this.world.speed.toFixed(1)} · ${this.world.scale.length} notes · H${Math.round(parseInt(this.world.palette.primary.slice(5)))}`;
  }
}

// ---------- App bootstrap ----------
(function() {
  const canvas = document.getElementById('gameCanvas');
  const game = new OmniGame(canvas);
  
  function getWorldIdFromURL() {
    const params = new URLSearchParams(location.search);
    let id = params.get('world');
    if (id === null && location.hash) {
      const m = location.hash.match(/world[=:]?(\d+)/i);
      if (m) id = m[1];
    }
    if (id === null) id = Math.floor(Math.random() * 10000000);
    return Math.max(0, Math.min(9999999, parseInt(id, 10) || 0));
  }
  
  function setURL(id) {
    const url = new URL(location.href);
    url.searchParams.set('world', id);
    history.replaceState(null, '', url);
  }
  
  function enterWorld(id) {
    id = Math.max(0, Math.min(9999999, Math.floor(Number(id) || 0)));
    game.loadWorld(id);
    setURL(id);
    document.getElementById('worldInput').value = id;
    document.getElementById('overlayTitle').textContent = game.world.name;
    document.getElementById('overlayDesc').textContent = `${game.world.genre.name} · Seed ${game.world.seed.toString(16).slice(0,6)}`;
    document.getElementById('btnStart').textContent = 'Enter Universe';
  }
  
  // Init
  const initialId = getWorldIdFromURL();
  enterWorld(initialId);
  
  // UI bindings
  document.getElementById('btnStart').addEventListener('click', () => {
    document.getElementById('overlay').style.display = 'none';
    game.start();
  });
  
  document.getElementById('btnGo').addEventListener('click', () => {
    const id = document.getElementById('worldInput').value;
    enterWorld(id);
  });
  
  document.getElementById('worldInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      enterWorld(document.getElementById('worldInput').value);
    }
  });
  
  document.getElementById('btnRandom').addEventListener('click', () => {
    const id = Math.floor(Math.random() * 10000000);
    enterWorld(id);
    document.getElementById('overlay').style.display = 'none';
    game.start();
  });
  
  document.getElementById('btnRandomOverlay').addEventListener('click', () => {
    const id = Math.floor(Math.random() * 10000000);
    enterWorld(id);
  });
  
  document.getElementById('btnMute').addEventListener('click', () => {
    const muted = game.audio.toggleMute();
    document.getElementById('iconSound').style.opacity = muted ? 0.35 : 1;
  });
  
  // Resume audio context on first interaction
  const resume = () => {
    if (game.audio.ctx && game.audio.ctx.state === 'suspended') game.audio.ctx.resume();
    window.removeEventListener('click', resume);
    window.removeEventListener('touchstart', resume);
  };
  window.addEventListener('click', resume);
  window.addEventListener('touchstart', resume);
})();
</script>
